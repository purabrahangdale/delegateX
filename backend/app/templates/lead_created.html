<h1 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; color: #18181b;">New Lead Assigned</h1>

<p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #3f3f46;">
  Dear {employee_name},
</p>

<p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.6; color: #3f3f46;">
  A new client lead, <strong>{lead_name}</strong>, has been registered and assigned to you in the CRM system.
</p>

<!-- Details Table -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 24px; font-size: 14px;">
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; width: 120px; vertical-align: top;">Lead Name</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5; font-weight: 500;">{lead_name}</td>
  </tr>
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; vertical-align: top;">Lead Email</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5;">
      <a href="mailto:{lead_email}" style="color: #4f46e5; text-decoration: none;">{lead_email}</a>
    </td>
  </tr>
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; vertical-align: top;">Phone</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5;">{lead_phone}</td>
  </tr>
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; vertical-align: top;">Priority</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5;">
      <span style="display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; {priority_style}">{priority}</span>
    </td>
  </tr>
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; vertical-align: top;">Assigned Date</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5;">{assigned_date}</td>
  </tr>
  <tr>
    <td class="table-header" style="padding: 10px 0; font-weight: 500; color: #71717a; border-bottom: 1px solid #f4f4f5; vertical-align: top;">Referrer/Source</td>
    <td class="table-data" style="padding: 10px 0; color: #18181b; border-bottom: 1px solid #f4f4f5;">{referrer}</td>
  </tr>
</table>
