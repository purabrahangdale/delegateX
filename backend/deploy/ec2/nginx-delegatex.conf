# Nginx reverse proxy for the DelegateX backend.
# Install: replace api.example.com with your real domain, then
#   sudo cp nginx-delegatex.conf /etc/nginx/sites-available/delegatex
#   sudo ln -s /etc/nginx/sites-available/delegatex /etc/nginx/sites-enabled/delegatex
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com --redirect
# Certbot adds the `listen 443 ssl` block, certificate paths and the HTTP->HTTPS redirect to this file,
# and its systemd timer renews the certificate automatically.

# WebSocket upgrade for /ws/whatsapp, /ws/crm, /ws/delegation, /ws/notifications
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # WhatsApp media uploads / knowledge-base documents
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Host must be the public domain: the app builds public media URLs from it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # long-lived WebSockets
        proxy_send_timeout 60s;
    }
}
